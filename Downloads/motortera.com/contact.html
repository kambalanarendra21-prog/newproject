<title>Contact | MotorTera</title>

<style>
:root{--primary:#14532D;--accent:#84CC16;--bg:#F7FEE7;--text:#14532D;--muted:#4D7C0F;--font-display:"Syne",system-ui,sans-serif;--font-body:"Work Sans",system-ui,sans-serif}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.55}
.wrap{width:min(900px,calc(100% - 2rem));margin:0 auto}
header{padding:1.25rem 0;border-bottom:1px solid #e5e7eb;background:#fff}
.brand{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--font-display);font-weight:800;text-decoration:none;color:var(--text)}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-weight:800}
main{padding:3rem 0 4rem}
h1{font-family:var(--font-display);font-size:clamp(1.8rem,4vw,2.6rem);margin:0 0 1rem}
p,li{color:var(--muted)}
a{color:var(--primary)}
footer{background:#0b1220;color:#fff;padding:2rem 0;font-size:.95rem}
footer a{color:#fff}
</style>
</head>
